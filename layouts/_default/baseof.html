<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: rgba(255,255,255,0.78);
      --surface-strong: rgba(255,255,255,0.92);
      --fg: #0f172a;
      --muted: #475569;
      --soft: #64748b;
      --line: rgba(148,163,184,0.26);
      --line-strong: rgba(100,116,139,0.28);
      --accent: #2563eb;
      --accent-2: #7c3aed;
      --accent-soft: rgba(37,99,235,0.10);
      --shadow: 0 10px 30px rgba(15,23,42,0.08);
      --shadow-lg: 0 20px 50px rgba(15,23,42,0.12);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --max: 1180px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #07111f;
        --surface: rgba(15,23,42,0.72);
        --surface-strong: rgba(15,23,42,0.9);
        --fg: #e5eefb;
        --muted: #c6d4ea;
        --soft: #93a5c3;
        --line: rgba(148,163,184,0.18);
        --line-strong: rgba(148,163,184,0.24);
        --accent: #7cb4ff;
        --accent-2: #a78bfa;
        --accent-soft: rgba(124,180,255,0.12);
        --shadow: 0 14px 32px rgba(2,8,23,0.34);
        --shadow-lg: 0 24px 64px rgba(2,8,23,0.44);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font: 16px/1.75 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--fg);
      background:
        radial-gradient(circle at top left, rgba(37,99,235,0.10), transparent 30%),
        radial-gradient(circle at top right, rgba(124,58,237,0.10), transparent 28%),
        linear-gradient(180deg, rgba(255,255,255,0.6), transparent 16%),
        var(--bg);
      min-height: 100vh;
      padding: 28px 18px 44px;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .site-shell {
      max-width: var(--max);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: var(--shadow);
      font-size: 22px;
      flex: 0 0 auto;
    }

    .brand-text { min-width: 0; }
    .brand-kicker {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: var(--soft);
      margin-bottom: 2px;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .topnav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-pill {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.42);
      color: var(--muted);
      font-size: 14px;
      transition: .2s ease;
    }
    .nav-pill:hover, .nav-pill.active {
      color: var(--fg);
      border-color: rgba(37,99,235,0.28);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px rgba(37,99,235,0.06);
    }

    .hero-card,
    .glass-card {
      border: 1px solid var(--line);
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
    }

    .hero-card {
      padding: 34px;
      margin-bottom: 24px;
      overflow: hidden;
      position: relative;
    }
    .hero-card::after {
      content: "";
      position: absolute;
      right: -80px;
      top: -80px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(124,58,237,0.16), transparent 65%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .hero-title {
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.12;
      letter-spacing: -0.04em;
      margin-bottom: 14px;
      max-width: 14ch;
    }

    .hero-desc {
      max-width: 760px;
      color: var(--muted);
      font-size: 17px;
      margin-bottom: 24px;
    }

    .hero-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
    }

    .metric {
      border: 1px solid var(--line);
      background: var(--surface-strong);
      border-radius: var(--radius-md);
      padding: 16px 18px;
    }
    .metric-label {
      font-size: 12px;
      color: var(--soft);
      text-transform: uppercase;
      letter-spacing: .14em;
      margin-bottom: 6px;
    }
    .metric-value {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      margin: 0 0 16px;
    }
    .section-head h2 {
      font-size: 24px;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .section-head p {
      color: var(--muted);
      font-size: 14px;
    }

    .date-grid,
    .paper-grid {
      display: grid;
      gap: 16px;
    }
    .date-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .paper-grid { grid-template-columns: 1fr; }

    .card-link {
      display: block;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface-strong);
      padding: 20px;
      box-shadow: var(--shadow);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card-link:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(37,99,235,0.24);
    }

    .card-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--soft);
      text-transform: uppercase;
      letter-spacing: .16em;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .card-desc {
      color: var(--muted);
      font-size: 14px;
    }
    .card-meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--soft);
      font-size: 13px;
      margin-top: 14px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .tag {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(148,163,184,0.12);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 280px) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 20px;
      padding: 20px;
    }
    .sidebar h3 {
      font-size: 16px;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .sidebar p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 16px;
    }
    .sidebar-list {
      list-style: none;
      display: grid;
      gap: 10px;
    }
    .sidebar-list a {
      display: block;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
      background: rgba(255,255,255,0.36);
      transition: .18s ease;
      font-size: 14px;
      line-height: 1.5;
    }
    .sidebar-list a:hover,
    .sidebar-list a.current {
      color: var(--fg);
      border-color: rgba(37,99,235,0.24);
      background: var(--accent-soft);
    }

    .article-shell {
      padding: 28px 30px 36px;
    }

    .breadcrumbs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--soft);
      font-size: 13px;
      margin-bottom: 18px;
    }
    .breadcrumbs a { color: var(--soft); }
    .breadcrumbs a:hover { color: var(--accent); }

    .article-meta-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.4);
      color: var(--muted);
      font-size: 13px;
    }

    article { font-size: 16px; }
    article h1 {
      font-size: clamp(32px, 4vw, 46px);
      line-height: 1.15;
      letter-spacing: -0.045em;
      margin-bottom: 18px;
    }
    article h2 {
      font-size: 28px;
      line-height: 1.28;
      letter-spacing: -0.03em;
      margin: 36px 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    article h3 {
      font-size: 22px;
      line-height: 1.35;
      letter-spacing: -0.02em;
      margin: 28px 0 12px;
    }
    article p, article ul, article ol, article blockquote, article pre {
      margin-bottom: 16px;
    }
    article p, article li { color: var(--fg); }
    article ul, article ol { padding-left: 24px; }
    article blockquote {
      border: 1px solid var(--line);
      background: rgba(37,99,235,0.06);
      padding: 16px 18px;
      border-radius: 0 16px 16px 16px;
      color: var(--muted);
    }
    article code {
      background: rgba(148,163,184,0.14);
      border: 1px solid var(--line);
      padding: 2px 7px;
      border-radius: 8px;
      font-size: .92em;
    }
    article pre {
      overflow-x: auto;
      padding: 16px;
      border-radius: 18px;
      background: rgba(15,23,42,0.92);
      color: #e2e8f0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    article pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
    }
    article img {
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      background: white;
      margin: 18px auto;
    }
    article hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 28px 0;
    }

    .action-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-strong);
      color: var(--fg);
      font-size: 14px;
      box-shadow: var(--shadow);
    }
    .button-link.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      border-color: transparent;
    }

    footer {
      margin-top: 28px;
      padding: 18px 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--surface);
      color: var(--soft);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
    }

    @media (max-width: 960px) {
      .content-grid { grid-template-columns: 1fr; }
      .sidebar { position: static; order: 2; }
      .article-shell { order: 1; }
    }

    @media (max-width: 720px) {
      body { padding: 16px 12px 32px; }
      .topbar, .hero-card, .article-shell, .sidebar, footer { padding: 18px; }
      .topbar { align-items: flex-start; }
      .brand-title { white-space: normal; }
      .hero-title { max-width: none; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .metric-value { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="{{ .Site.Home.RelPermalink }}">
        <div class="brand-mark">📚</div>
        <div class="brand-text">
          <div class="brand-kicker">Hugging Face · Daily Papers</div>
          <div class="brand-title">{{ .Site.Title }}</div>
          <div class="brand-subtitle">{{ .Site.Params.description }}</div>
        </div>
      </a>
      <nav class="topnav">
        <a class="nav-pill{{ if .IsHome }} active{{ end }}" href="{{ .Site.Home.RelPermalink }}">首页</a>
        <a class="nav-pill{{ if eq .Section "posts" }} active{{ end }}" href="{{ "posts/" | relURL }}">日报导航</a>
      </nav>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <footer>
      <span>{{ .Site.Params.description }}</span>
      <span>Powered by Hugo · <a href="https://github.com/xiaobin01/hf-paper-daily-blog">GitHub</a></span>
    </footer>
  </div>
</body>
</html>
