<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="theme-color" content="#ffd21e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-subtle: #f7f7f5;
      --surface-tint: #fff9de;
      --fg: #0d1117;
      --fg-soft: #374151;
      --muted: #6b7280;
      --line: #e5e7eb;
      --line-strong: #d1d5db;
      --accent: #ffd21e;
      --accent-deep: #f59e0b;
      --accent-ink: #1f2937;
      --blue: #2563eb;
      --green: #16a34a;
      --purple: #9333ea;
      --pink: #db2777;
      --shadow-xs: 0 1px 0 rgba(13, 17, 23, 0.04);
      --shadow-sm: 0 10px 30px rgba(13, 17, 23, 0.05);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --container: 1240px;
      --font-display: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      --font-body: "Source Sans 3", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif: "Source Serif 4", Georgia, serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1016;
        --surface: #11161d;
        --surface-subtle: #0f141b;
        --surface-tint: #17140a;
        --fg: #f3f4f6;
        --fg-soft: #d1d5db;
        --muted: #9ca3af;
        --line: #222a35;
        --line-strong: #313b49;
        --accent: #ffd21e;
        --accent-deep: #eab308;
        --accent-ink: #10151b;
        --shadow-xs: 0 1px 0 rgba(255,255,255,0.02);
        --shadow-sm: 0 18px 40px rgba(0, 0, 0, 0.30);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--fg);
      background: var(--bg);
      line-height: 1.65;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    code, pre { font-family: var(--font-display); }

    .site-shell {
      max-width: var(--container);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      padding: 14px 18px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: var(--shadow-xs);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: var(--accent-ink);
      border: 1px solid rgba(13, 17, 23, 0.08);
      font-size: 22px;
      flex: 0 0 auto;
    }

    .brand-kicker,
    .eyebrow,
    .meta-label,
    .card-kicker,
    .section-kicker,
    .stat-label,
    .toc-title,
    .mini-label {
      font-family: var(--font-display);
      font-size: 12px;
      line-height: 1.35;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-text { min-width: 0; }
    .brand-kicker { color: var(--muted); margin-bottom: 2px; }
    .brand-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-subtitle {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topnav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }
    .nav-pill {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--fg-soft);
      background: var(--surface);
      font-size: 14px;
      transition: .18s ease;
    }
    .nav-pill:hover,
    .nav-pill.active {
      border-color: var(--fg);
      color: var(--fg);
      background: var(--surface-tint);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.9fr);
      gap: 22px;
      margin-bottom: 22px;
    }

    .panel,
    .hero-main,
    .hero-side,
    .content-card,
    .paper-card,
    .date-card,
    .sidebar-card,
    .article-card,
    .summary-card,
    .gallery-card,
    .callout-card,
    .empty-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xs);
    }

    .hero-main {
      padding: 32px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--surface) 88%, var(--accent) 12%), var(--surface));
    }
    .hero-main::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 6px;
      background: var(--accent);
    }

    .hero-side {
      padding: 22px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg-soft);
      margin-bottom: 16px;
    }

    .hero-title,
    .page-title,
    article h1,
    article h2,
    article h3,
    .section-title,
    .card-title,
    .stat-value {
      font-family: var(--font-display);
    }

    .hero-title {
      margin: 0 0 14px;
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1.05;
      letter-spacing: -0.03em;
      max-width: 15ch;
    }

    .hero-desc {
      max-width: 64ch;
      margin: 0 0 22px;
      color: var(--fg-soft);
      font-size: 18px;
      line-height: 1.7;
    }

    .hero-actions,
    .action-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--fg);
      font-size: 14px;
      font-weight: 600;
      transition: .18s ease;
    }
    .button-link:hover { transform: translateY(-1px); }
    .button-link.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .stat {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-subtle);
    }
    .stat-label { color: var(--muted); margin-bottom: 8px; }
    .stat-value {
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }
    .stat-note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .section-block,
    .content-card,
    .article-card,
    .sidebar-card,
    .summary-card,
    .gallery-card,
    .callout-card,
    .empty-card {
      padding: 24px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .section-kicker {
      color: var(--muted);
      margin-bottom: 6px;
    }
    .section-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    .section-desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      max-width: 58ch;
    }

    .date-grid,
    .paper-grid,
    .feature-grid,
    .gallery-grid {
      display: grid;
      gap: 16px;
    }
    .date-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .paper-grid { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .feature-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .gallery-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

    .date-card,
    .paper-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      transition: .18s ease;
    }
    .date-card:hover,
    .paper-card:hover {
      transform: translateY(-2px);
      border-color: var(--fg);
      box-shadow: var(--shadow-sm);
    }
    .card-kicker { color: var(--muted); }
    .card-title {
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: -0.025em;
    }
    .card-desc {
      color: var(--fg-soft);
      font-size: 15px;
      line-height: 1.6;
      flex: 1;
    }
    .card-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }

    .tag-row,
    .chip-row,
    .meta-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tag,
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-subtle);
      color: var(--fg-soft);
      font-size: 12px;
    }
    .chip.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(260px, 300px) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .sidebar-stack {
      display: grid;
      gap: 16px;
      position: sticky;
      top: 82px;
      align-content: start;
      max-height: calc(100vh - 96px);
      overflow: auto;
      padding-right: 2px;
    }

    .sidebar-card h3,
    .summary-card h3,
    .gallery-card h3,
    .callout-card h3 {
      margin: 0 0 10px;
      font-family: var(--font-display);
      font-size: 18px;
      line-height: 1.2;
    }

    .sidebar-card p,
    .summary-card p,
    .callout-card p {
      margin: 0 0 12px;
      color: var(--fg-soft);
      font-size: 14px;
    }

    .sidebar-list,
    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }

    .toc-list nav,
    .toc-list ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .toc-list ul ul {
      margin-left: 12px;
    }

    .sidebar-list a,
    .toc-list a {
      display: block;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface-subtle);
      color: var(--fg-soft);
      font-size: 14px;
      line-height: 1.45;
      transition: .18s ease;
    }
    .sidebar-list a:hover,
    .sidebar-list a.current,
    .toc-list a:hover {
      background: var(--surface-tint);
      border-color: var(--line-strong);
      color: var(--fg);
    }

    .breadcrumbs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 13px;
    }
    .breadcrumbs a:hover { color: var(--fg); }

    .article-hero {
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .article-hero .page-title {
      margin: 0 0 12px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .article-subtitle {
      margin: 0 0 16px;
      color: var(--fg-soft);
      font-size: 18px;
      line-height: 1.7;
      font-family: var(--font-serif);
    }

    .article-layout {
      display: grid;
      gap: 22px;
    }

    article {
      font-size: 18px;
      line-height: 1.82;
    }
    article > *:first-child { margin-top: 0 !important; }
    article h1 {
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.08;
      letter-spacing: -0.035em;
      margin: 0 0 18px;
    }
    article h2 {
      margin: 40px 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -0.03em;
      scroll-margin-top: 100px;
    }
    article h3 {
      margin: 28px 0 10px;
      font-size: 22px;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }
    article p,
    article ul,
    article ol,
    article blockquote,
    article pre,
    article table {
      margin: 0 0 18px;
    }
    article p,
    article li {
      color: var(--fg);
    }
    article ul,
    article ol { padding-left: 24px; }
    article strong { color: var(--fg); }
    article blockquote {
      padding: 18px 20px;
      border-left: 4px solid var(--accent);
      background: var(--surface-tint);
      border-radius: 0 12px 12px 0;
      color: var(--fg-soft);
    }
    article code {
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--surface-subtle);
      border: 1px solid var(--line);
      font-size: .9em;
    }
    article pre {
      overflow-x: auto;
      padding: 16px;
      border-radius: 12px;
      background: #0f1720;
      color: #e5edf5;
      border: 1px solid rgba(255,255,255,0.04);
    }
    article pre code {
      padding: 0;
      background: transparent;
      border: 0;
      color: inherit;
    }
    article hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 28px 0;
    }
    article img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 8px;
      box-shadow: var(--shadow-xs);
      margin: 20px 0 10px;
    }
    article p:has(img) {
      margin-bottom: 24px;
    }

    .figure-rail {
      display: grid;
      gap: 12px;
    }
    .figure-item {
      display: grid;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .figure-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .figure-item img {
      aspect-ratio: 16 / 10;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .figure-item a {
      color: var(--fg);
      font-size: 13px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 28px;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface-subtle);
      color: var(--muted);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .empty-card {
      color: var(--fg-soft);
      font-size: 15px;
    }

    @media (max-width: 1080px) {
      .hero,
      .content-grid {
        grid-template-columns: 1fr;
      }
      .sidebar-stack {
        position: static;
      }
    }

    @media (max-width: 720px) {
      .site-shell { padding: 14px; }
      .topbar,
      .hero-main,
      .hero-side,
      .section-block,
      .content-card,
      .article-card,
      .sidebar-card,
      .summary-card,
      .gallery-card,
      .callout-card,
      .empty-card,
      .footer { padding: 18px; }
      .topbar { align-items: flex-start; }
      .brand-title,
      .brand-subtitle { white-space: normal; }
      .section-head { flex-direction: column; align-items: flex-start; }
      article { font-size: 17px; }
      .paper-grid,
      .date-grid,
      .gallery-grid,
      .feature-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="{{ .Site.Home.RelPermalink }}">
        <div class="brand-mark">🤗</div>
        <div class="brand-text">
          <div class="brand-kicker">Hugging Face Daily Papers</div>
          <div class="brand-title">{{ .Site.Title }}</div>
          <div class="brand-subtitle">{{ .Site.Params.description }}</div>
        </div>
      </a>
      <nav class="topnav">
        <a class="nav-pill{{ if .IsHome }} active{{ end }}" href="{{ .Site.Home.RelPermalink }}">首页</a>
        <a class="nav-pill{{ if eq .Section "posts" }} active{{ end }}" href="{{ "posts/" | relURL }}">论文归档</a>
      </nav>
    </header>

    <main>
      {{ block "main" . }}{{ end }}
    </main>

    <footer class="footer">
      <span>{{ .Site.Params.description }}</span>
      <span>Powered by Hugo · <a href="https://github.com/xiaobin01/hf-paper-daily-blog">GitHub</a></span>
    </footer>
  </div>
</body>
</html>
