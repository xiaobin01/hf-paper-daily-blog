<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <style>
    :root { --bg: #fff; --fg: #222; --link: #0366d6; --border: #e1e4e8; --code-bg: #f6f8fa; --tag-bg: #f0f0f0; }
    @media(prefers-color-scheme:dark) { :root { --bg: #0d1117; --fg: #c9d1d9; --link: #58a6ff; --border: #30363d; --code-bg: #161b22; --tag-bg: #21262d; } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font: 16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background: var(--bg); color: var(--fg); max-width: 860px; margin: 0 auto; padding: 20px; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { border-bottom: 1px solid var(--border); padding: 20px 0; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    header h1 { font-size: 1.5em; }
    header h1 a { color: var(--fg); }
    .paper-list { list-style: none; }
    .paper-item { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; transition: box-shadow .2s; }
    .paper-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .paper-item h3 { font-size: 1.1em; margin-bottom: 6px; }
    .paper-meta { font-size: .85em; color: #666; margin-bottom: 8px; }
    .tag { display: inline-block; background: var(--tag-bg); border-radius: 4px; padding: 2px 8px; font-size: .8em; margin-right: 4px; }
    .pagination { text-align: center; padding: 20px 0; }
    .pagination a { padding: 8px 16px; border: 1px solid var(--border); border-radius: 4px; margin: 0 4px; }
    article { line-height: 1.8; }
    article img { max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 4px; margin: 10px 0; }
    article h1 { font-size: 1.8em; margin-bottom: 16px; }
    article h2 { font-size: 1.3em; margin: 24px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    article h3 { font-size: 1.1em; margin: 20px 0 8px; }
    article p { margin-bottom: 12px; }
    article blockquote { border-left: 3px solid #58a6ff; padding: 8px 16px; background: var(--code-bg); border-radius: 0 4px 4px 0; margin: 12px 0; }
    article code { background: var(--code-bg); padding: 2px 6px; border-radius: 3px; font-size: .9em; }
    article pre { background: var(--code-bg); padding: 12px; border-radius: 6px; overflow-x: auto; margin: 12px 0; }
    footer { text-align: center; padding: 30px 0; border-top: 1px solid var(--border); margin-top: 40px; font-size: .85em; color: #888; }
    .back-link { display: inline-block; margin-bottom: 20px; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{{ .Site.BaseURL }}">📚 {{ .Site.Title }}</a></h1>
    <nav>
      <a href="{{ .Site.BaseURL }}">首页</a>
      {{ range .Site.Home.Sections }}
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ end }}
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    {{ .Site.Params.description }} · Powered by Hugo · <a href="{{ .Site.Params.github }}">GitHub</a>
  </footer>
</body>
</html>
